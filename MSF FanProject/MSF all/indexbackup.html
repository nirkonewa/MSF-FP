<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.7">
    <title>MSF Fan Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="top-nav">
    <div style="display: flex; align-items: center; gap: 12px;">
<a href="#" id="logoBtn" class="logo-title" style="text-decoration: none;">
    MARVEL&nbsp;<span class="highlight">STRIKE FORCE</span>
</a>
        
        <div style="display: inline-flex; align-items: center; gap: 8px;">
            <span class="sub-location">ALLIANCE WAR</span>
            <span id="pinIcon" title="Pripnúť tento mód" style="cursor: pointer; font-size: 16px; opacity: 0.3; transition: 0.3s;">📌</span>
        </div>
    </div>
    
    <select id="navMenu" class="nav-menu-select">
        <option value="" disabled selected hidden>MENU ☰</option>
    <option value="home">🏠 DOMOV</option>
    <option value="war">⚔️ ALLIANCE WAR</option>
    <option value="crucible">🛡️ COSMIC CRUCIBLE</option>
    <option value="arena">🏛️ ARENA</option>
    <option value="towers">🗼 TOWERS</option>
    <option value="codes">🎁 KÓDY</option>
    <option value="events">📅 EVENTY</option>
    <option value="danger">⚡ DANGER ROOMS</option>
    <option value="trials">🏆 TRIALS</option>
    <option value="characters">POSTAVY</option>
    <option value="admin">Admin</option>
    </select>
</header>
<section id="home-dashboard" class="dashboard-section">
    <div class="tiles-grid">
        <div class="tile" style="background-image: url('../obrazky/AW-Background.png')" onclick="document.getElementById('navMenu').value='war'; document.getElementById('navMenu').dispatchEvent(new Event('change'));">Alliance War</div>
        <div class="tile" style="background-image: url('../obrazky/CC-Background.png')" onclick="document.getElementById('navMenu').value='crucible'; document.getElementById('navMenu').dispatchEvent(new Event('change'));">Cosmic Crucible</div>
        <div class="tile" onclick="window.location.href='arena.html'">ARENA</div>
        <div class="tile" style="background-image: url('../obrazky/CC-Background.png')" onclick="document.getElementById('navMenu').value='admin'; document.getElementById('navMenu').dispatchEvent(new Event('change'));">Admin</div>
    </div>
</section>
    <section class="roster-section" style="padding-top: 6px;">
        <input type="text" id="searchInput" class="search-bar" placeholder="Vyhľadať postavu...">
        <div id="character-count" style="margin-bottom: 13px; color: #00d2ff; font-size: 13px; text-align: center;">Počet zobrazených postáv: 0</div>
        <div class="character-grid" id="character-container"></div>
    </section>

<script type="module" src="scriptbackup.js"></script>

    <button id="backToTop" title="Hore na vrch">Hore ⇧</button>

</body>
</html>

<input type="text" id="charName" placeholder="Meno postavy">
<input type="text" id="charImage" placeholder="URL obrázka">
<button onclick="saveToFirebase()">Uložiť do databázy</button>

<script type="module">
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
  const db = getDatabase();

  window.saveToFirebase = function() {
    const name = document.getElementById('charName').value;
    const image = document.getElementById('charImage').value;
    const key = name.toLowerCase().replace(" ", "");
    
    set(ref(db, 'characters/' + key), {
      name: name,
      image: image
    });
    alert("Uložené!");
  }
</script>
